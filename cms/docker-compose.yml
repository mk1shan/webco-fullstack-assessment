version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: mudipa
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  directus:
    image: directus/directus:latest
    container_name: cms_directus
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "8055:8055"

    environment:
      KEY: local-dev-key
      SECRET: local-dev-secret

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: mudipa
      DB_PASSWORD: password123

      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      REDIS: redis://redis:6379

      ADMIN_EMAIL: mudipakishan@gmail.com
      ADMIN_PASSWORD: admin123

    volumes:
      - directus_uploads:/directus/uploads

volumes:
  postgres_data:
  redis_data:
  directus_uploads:
